<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>모찌픽 인포크 목록</title>
<link rel="stylesheet" href="style.css">
<style id="hubnav-css">
.hubnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.hubnav a{display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid #d9d6cf;background:#fff;color:#2a2826;font:600 14px/1.35 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;text-decoration:none;white-space:nowrap}
.hubnav a:hover{border-color:#8f8b82}
.hubnav a.on{background:#2a2826;border-color:#2a2826;color:#fff}
.hubnav a:focus-visible{outline:2px solid #e8bc00;outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hubnav a{background:#26241f;border-color:#3b3934;color:#ece9e3}:root:not([data-theme="light"]) .hubnav a.on{background:#ece9e3;border-color:#ece9e3;color:#1c1b19}}
:root[data-theme="dark"] .hubnav a{background:#26241f;border-color:#3b3934;color:#ece9e3}
:root[data-theme="dark"] .hubnav a.on{background:#ece9e3;border-color:#ece9e3;color:#1c1b19}
</style>
<style>
.ink{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.ink li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ink .n{font-variant-numeric:tabular-nums;font-weight:800;min-width:38px}
.ink .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ink .dup{font-size:12px;color:var(--amber);font-weight:700}
.next{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;margin-top:14px;font-weight:700}
#q{font:inherit;width:100%;margin-top:12px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
</style>
</head><body>
<div class="wrap">
  <nav class="hubnav" aria-label="사이트 이동"><a href="https://fitnessmizfit0005-sketch.github.io/naver-blog-daily/">네이버 블로그</a><a href="https://fitnessmizfit0005-sketch.github.io/daangn/">당근 소식</a><a class="on" href="https://fitnessmizfit0005-sketch.github.io/shopping-shorts/" aria-current="page">쇼핑쇼츠</a><a href="https://fitnessmizfit0005-sketch.github.io/naver-blog-daily/sb-reels/">스뷰 릴스</a><a href="https://fitnessmizfit0005-sketch.github.io/naver-blog-daily/vitalfoodlab/">애드센스</a></nav>
  <a class="btn" href="./">← 주차 목록</a>
  <h1>모찌픽 인포크 목록</h1>
  <p class="lead" id="lead"></p>
  <div class="next" id="next"></div>
  <input id="q" type="search" placeholder="제품명으로 찾기" aria-label="제품명으로 찾기">
  <ul class="ink" id="list"></ul>
  <div class="tools"><a class="btn" href="https://github.com/fitnessmizfit0005-sketch/shopping-shorts/edit/main/data/inpock.json" target="_blank" rel="noopener">✎ 목록 편집</a><a class="btn" href="https://inpk.link/mozzipick" target="_blank" rel="noopener">인포크 페이지 열기</a></div>
  <p class="foot">인포크에 새 상품을 등록하면 Claude에게 "인포크 목록 업데이트해줘"라고 하거나, 편집 버튼으로 맨 위에 한 줄 추가하세요. 같은 링크를 쓰는 번호는 "링크 중복"으로 표시돼요.</p>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[];
function draw(q){
  const cnt={};all.forEach(i=>cnt[i.url]=(cnt[i.url]||0)+1);
  const rows=all.filter(i=>!q||i.title.includes(q)||i.no.includes(q));
  document.getElementById("list").innerHTML=rows.map(i=>`<li><span class="n">${esc(i.no)}</span><span class="t">${esc(i.title)}${cnt[i.url]>1?' <span class="dup">링크 중복</span>':''}</span><button class="copy" type="button" data-c="${esc(i.url)}">링크 복사</button><a class="copy" href="${esc(i.url)}" target="_blank" rel="noopener">열기</a></li>`).join("");
}
fetch("data/inpock.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  all=d.items.slice().sort((a,b)=>b.no.localeCompare(a.no));
  const nx=String(Math.max(...all.map(i=>+i.no))+1).padStart(3,"0");
  document.getElementById("lead").textContent=`${all.length}개 · ${d.checked} 기준`;
  document.getElementById("next").textContent=`다음 등록 번호: ${nx}번  →  "${nx}. 제품명" 형식`;
  draw("");
});
document.getElementById("q").addEventListener("input",e=>draw(e.target.value.trim()));
document.addEventListener("click",e=>{const c=e.target.closest("button.copy");if(!c)return;
  navigator.clipboard&&navigator.clipboard.writeText(c.dataset.c).then(()=>{c.textContent="복사됨";setTimeout(()=>c.textContent="링크 복사",1200)}).catch(()=>{});});
</script>
</body></html>
