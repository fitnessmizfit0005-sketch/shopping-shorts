name: 제작표 상태 변경
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  pages: write
concurrency:
  group: status-update
  cancel-in-progress: false
jobs:
  update:
    if: startsWith(github.event.issue.title, '[상태]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 상태 바꾸기
        id: upd
        env:
          TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/set_status.py "$TITLE"
      - name: 커밋
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "$TITLE"
          git push
      - name: 사이트 다시 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
      - name: 이슈 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.upd.outputs.msg }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "${MSG:-처리 실패 - 제목 형식을 확인해 주세요}"
